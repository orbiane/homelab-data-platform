metrics:
  - name: subscription_count
    description: "登録数（全量。U プレフィックスが欠けた contact_id を含む実データそのまま）"
    type: simple
    label: "登録数"
    type_params:
      measure: subscription_count

  - name: delivered_count
    description: "配信数"
    type: simple
    label: "配信数"
    type_params:
      measure: delivered_count

  - name: clicked_count
    description: "クリック数"
    type: simple
    label: "クリック数"
    type_params:
      measure: clicked_count

  - name: opened_count
    description: "開封数。event_type=opened の行数（docs/business/2026-11-06-ctr-opened.md）"
    type: simple
    label: "開封数"
    type_params:
      measure: opened_count

  - name: ctr_per_open
    description: "クリック率 = クリック数 ÷ 開封数（docs/business/2026-11-06-ctr-opened.md）"
    type: ratio
    label: "クリック率"
    type_params:
      numerator: clicked_count
      denominator: opened_count

  - name: revenue_amount
    description: |
      売上額（最新スナップショットの値。未確定の月を含む）。
      ★通貨混在：JPY と USD を無変換で合算しているため、
      currency で絞らない全体値は意味を持たない。
    type: simple
    label: "売上額"
    type_params:
      measure: revenue_amount
