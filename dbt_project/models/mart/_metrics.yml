metrics:
  - name: subscription_count
    description: "登録数（全量。U プレフィックスが欠けた contact_id を含む実データそのまま）"
    type: simple
    label: "登録数"
    type_params:
      measure: subscription_count

  - name: delivered_count
    description: "配信数"
    type: simple
    label: "配信数"
    type_params:
      measure: delivered_count

  - name: clicked_count
    description: "クリック数"
    type: simple
    label: "クリック数"
    type_params:
      measure: clicked_count

  - name: ctr
    description: "クリック率 = クリック数 ÷ 配信数"
    type: ratio
    label: "CTR"
    type_params:
      numerator: clicked_count
      denominator: delivered_count

  - name: revenue_amount
    description: |
      売上額（最新スナップショットの値。未確定の月を含む）。
      ★通貨混在：JPY と USD を無変換で合算しているため、
      currency で絞らない全体値は意味を持たない。
    type: simple
    label: "売上額"
    type_params:
      measure: revenue_amount
